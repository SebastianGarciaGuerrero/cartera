# Configuracion de Alembic (migraciones versionadas de la base de datos).
# (Este archivo va sin tildes: Alembic lo lee con la codificacion de Windows.)
#
# Uso (desde la carpeta backend, con el venv activo):
#   alembic upgrade head            -> deja la base en la ultima version
#   alembic current                 -> en que version esta la base
#   alembic history                 -> lista de migraciones
#   alembic revision -m "mensaje"   -> crea una migracion nueva (vacia)
#
# La URL de la base NO va aca: se lee de DATABASE_URL (backend/.env o
# variable de entorno). Para apuntar a otra base puntual:
#   alembic -x url=postgresql://... upgrade head

[alembic]
script_location = migraciones
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
timezone = America/Santiago

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
