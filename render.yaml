# Blueprint de Render: al conectar el repo (New → Blueprint), Render lee este
# archivo y crea el servicio. Ver DEPLOY.md para el paso a paso.
#
# La imagen (Dockerfile) compila el frontend, aplica las migraciones en la
# base (Supabase) al arrancar y sirve API + frontend en una sola URL.
services:
  - type: web
    name: cartera
    runtime: docker
    # Misma región que la base de Supabase (us-east-2, Ohio): cada consulta
    # cruzando a Oregon sumaba ~0,7 s por pantalla.
    region: ohio
    # Starter (US$7/mes): no se duerme (el gratuito se apagaba a los 15 min y tardaba ~50 s en despertar).
    plan: starter
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false          # se pega a mano en Render: la del Session pooler de Supabase
      - key: SECRET_KEY
        generateValue: true  # Render genera una clave larga y aleatoria
      - key: ENVIRONMENT
        value: production
      - key: URL_PUBLICA
        sync: false          # la URL que asigne Render, ej. https://cartera-xxxx.onrender.com
      # Pool chico: alcanza para el equipo y no agota las conexiones del pooler de Supabase.
      - key: POOL_SIZE
        value: "3"
      - key: POOL_MAX_OVERFLOW
        value: "2"
